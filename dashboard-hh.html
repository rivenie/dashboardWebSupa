<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Mano de Obra</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <nav class="dash-tabs">
        <a href="dashboard-combustible.html" class="tab"><i class="fas fa-gas-pump"></i> Combustible</a>
        <a href="dashboard-kilometraje.html" class="tab"><i class="fas fa-road"></i> Kilometraje</a>
        <a href="dashboard-hh.html" class="tab active"><i class="fas fa-users"></i> Mano de Obra</a>
    </nav>

    <div id="loading" class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Cargando dashboard...</p>
    </div>

    <div id="dashboard" class="dashboard-section" style="display: none;">
        <header class="exec-header">
            <div class="exec-title">
                <div class="exec-logo"><i class="fas fa-users"></i></div>
                <div>
                    <h1>Mano de Obra</h1>
                    <span class="exec-subtitle">HH Directas e Indirectas · Reporte Diario</span>
                </div>
            </div>
            <div class="exec-actions">
                <span class="exec-date"><i class="fas fa-calendar-alt"></i> <span id="fechaActual"></span></span>
            </div>
        </header>

        <section class="kpi-row" id="kpiRow"></section>
        <section class="filters-row" id="filtersRow"></section>
        <section class="charts-exec" id="chartsGrid"></section>
    </div>

    <script src="js/dashboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            iniciarDashboardHH();
        });
    </script>
</body>
</html>
